<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCompute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58534"/><stop offset="1" stop-color="#C7511F"/>
    </linearGradient>
    <linearGradient id="gStorage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CAE3E"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="gConsole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4FFF"/><stop offset="1" stop-color="#5B3BC8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/>
    </marker>
    <linearGradient id="gSecurity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0474A"/><stop offset="1" stop-color="#B8262B"/>
    </linearGradient>
    <style>
      .group  { fill: none; stroke: #94A3B8; stroke-width: 1.3; }
      .gtitle { font-size: 15px; font-weight: 600; fill: #CBD5E1; }
      .label  { font-size: 12.5px; font-weight: 600; fill: #F1F5F9; }
      .sub    { font-size: 11px; fill: #94A3B8; }
      .edge   { fill: none; stroke: #CBD5E1; stroke-width: 1.8; }
      .callout      { fill: #F2443B; }
      .callout-text { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .step   { font-size: 11.5px; fill: #E2E8F0; }
      .glyph  { fill: none; stroke: #FFFFFF; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="560" rx="18" fill="#0F172A"/>

  <!-- ====================== Clients ====================== -->
  <rect x="40" y="56" width="260" height="330" rx="10" class="group" stroke-dasharray="6 5"/>
  <text x="170" y="84" text-anchor="middle" class="gtitle">Clients, unchanged</text>

  <!-- vault CLI -->
  <g transform="translate(78,108)">
    <rect width="70" height="70" rx="9" fill="#334155"/>
    <path d="M18 26 L30 35 L18 44 M34 46 H52" class="glyph"/>
    <text x="35" y="90" text-anchor="middle" class="label">vault CLI</text>
  </g>
  <!-- Terraform -->
  <g transform="translate(192,108)">
    <rect width="70" height="70" rx="9" fill="#334155"/>
    <path d="M22 16 L34 23 V37 L22 30 Z M36 23 L48 16 V30 L36 37 Z M36 40 L48 33 V47 L36 54 Z M22 33 L34 40 V54 L22 47 Z" fill="#FFFFFF"/>
    <text x="35" y="90" text-anchor="middle" class="label">Terraform</text>
  </g>
  <!-- hvac -->
  <g transform="translate(78,226)">
    <rect width="70" height="70" rx="9" fill="#334155"/>
    <text x="35" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">hvac</text>
    <text x="35" y="90" text-anchor="middle" class="label">Python</text>
  </g>
  <!-- lambdavault helper -->
  <g transform="translate(192,226)">
    <rect width="70" height="70" rx="9" fill="url(#gConsole)"/>
    <path d="M18 26 L30 35 L18 44 M34 46 H52" class="glyph"/>
    <text x="35" y="90" text-anchor="middle" class="label">lambdavault</text>
  </g>

  <text x="170" y="350" text-anchor="middle" class="sub">init · status · output (the helper, pip)</text>
  <text x="170" y="368" text-anchor="middle" class="sub">only <tspan fill="#F1F5F9" font-weight="600">VAULT_ADDR</tspan> changes</text>

  <path d="M300 220 L 418 220" class="edge" marker-end="url(#arrow)"/>
  <rect x="304" y="186" width="110" height="24" rx="5" class="callout"/>
  <text x="359" y="203" text-anchor="middle" class="callout-text">1  HTTPS · Vault API</text>

  <!-- browser -->
  <g transform="translate(135,430)">
    <rect width="70" height="52" rx="7" fill="#334155"/>
    <rect x="6" y="6" width="58" height="8" rx="2" fill="#CBD5E1"/>
    <circle cx="11" cy="10" r="2" fill="#F87171"/><circle cx="17" cy="10" r="2" fill="#FBBF24"/><circle cx="23" cy="10" r="2" fill="#34D399"/>
    <rect x="6" y="18" width="58" height="28" rx="2" fill="#E2E8F0"/>
    <rect x="11" y="23" width="26" height="4" rx="1.5" fill="#94A3B8"/><rect x="11" y="31" width="48" height="4" rx="1.5" fill="#CBD5E1"/><rect x="11" y="39" width="36" height="4" rx="1.5" fill="#CBD5E1"/>
    <text x="35" y="70" text-anchor="middle" class="label">Vault UI  /ui/</text>
  </g>
  <path d="M205 456 L 418 456" class="edge" marker-end="url(#arrow)"/>

  <!-- ====================== lambdavault ====================== -->
  <rect x="360" y="40" width="700" height="490" rx="12" class="group" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="380" y="70" class="gtitle" font-size="18" fill="#F8FAFC">lambdavault: HashiCorp Vault, serverless</text>
  <text x="380" y="88" class="sub">Lambda Function URL as VAULT_ADDR · S3 + KMS · ≈ $1 / month when idle (the KMS key)</text>

  <!-- Lambda -->
  <rect x="400" y="110" width="400" height="230" rx="9" class="group"/>
  <text x="600" y="134" text-anchor="middle" class="gtitle" font-size="13">Lambda (container image)</text>
  <g transform="translate(430,160)">
    <rect width="86" height="86" rx="10" fill="url(#gCompute)"/>
    <text x="43" y="62" text-anchor="middle" font-size="50" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="43" y="108" text-anchor="middle" class="label">Vault 2.2.0</text>
    <text x="43" y="124" text-anchor="middle" class="sub">official binary, unchanged</text>
  </g>
  <g transform="translate(540,160)">
    <rect width="22" height="22" rx="4" class="callout"/><text x="11" y="16" text-anchor="middle" class="callout-text">2</text>
    <text x="30" y="16" class="step">Web Adapter: invocation → HTTP to 127.0.0.1:8200</text>
    <rect y="44" width="22" height="22" rx="4" class="callout"/><text x="11" y="60" text-anchor="middle" class="callout-text">3</text>
    <text x="30" y="60" class="step">cold start: read state from S3, unseal with KMS</text>
    <rect y="88" width="22" height="22" rx="4" class="callout"/><text x="11" y="104" text-anchor="middle" class="callout-text">4</text>
    <text x="30" y="104" class="step">reserved concurrency 1: one Vault process writes</text>
    <text x="30" y="120" class="step">arm64 (default) or x86_64 — both images built</text>
  </g>

  <!-- Storage -->
  <rect x="830" y="110" width="200" height="230" rx="9" class="group"/>
  <text x="930" y="134" text-anchor="middle" class="gtitle" font-size="13">Storage</text>
  <g transform="translate(887,160)">
    <rect width="86" height="86" rx="10" fill="url(#gStorage)"/>
    <rect x="18" y="20" width="50" height="46" rx="5" class="glyph" stroke-width="3"/>
    <path d="M18 35 h50" class="glyph" stroke-width="2.4"/>
    <text x="43" y="108" text-anchor="middle" class="label">S3</text>
    <text x="43" y="124" text-anchor="middle" class="sub">Vault's encrypted data</text>
    <text x="43" y="138" text-anchor="middle" class="sub">versioned · private</text>
    <text x="43" y="154" text-anchor="middle" class="sub">durable · multi-AZ</text>
  </g>
  <path d="M800 203 L 885 203" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- KMS -->
  <g transform="translate(887,392)">
    <rect width="86" height="86" rx="10" fill="url(#gSecurity)"/>
    <circle cx="33" cy="43" r="12" class="glyph"/>
    <path d="M45 43 H68 M60 43 V53 M67 43 V50" class="glyph"/>
    <text x="43" y="108" text-anchor="middle" class="label">KMS: seal key</text>
  </g>
  <path d="M760 340 L 885 420" class="edge" marker-end="url(#arrow)"/>

  <!-- ECR -->
  <g transform="translate(430,392)">
    <rect width="86" height="86" rx="10" fill="url(#gCompute)" opacity="0.85"/>
    <rect x="20" y="22" width="46" height="42" rx="4" class="glyph"/>
    <path d="M20 36 h46 M20 50 h46" class="glyph" stroke-width="2"/>
    <text x="43" y="108" text-anchor="middle" class="label">ECR: images</text>
  </g>
  <path d="M473 390 L 473 346" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="540" y="412" width="22" height="22" rx="4" class="callout"/><text x="551" y="428" text-anchor="middle" class="callout-text">5</text>
  <text x="570" y="428" class="step">terraform apply builds arm64 + x86_64 images, pushes them,</text>
  <text x="570" y="444" class="step">deploys one; the Vault UI comes with the binary</text>

  <text x="710" y="512" text-anchor="middle" class="sub">Vault encrypts before S3 · root key wrapped by KMS · one writer · nothing runs while idle</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdavault"
version = "0.1.0"
description = "HashiCorp Vault on AWS Lambda + S3 + KMS, ≈ $0 when idle. The vault CLI, hvac and the Terraform vault provider talk to it unchanged; this package is the helper: status, output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "vault", "hashicorp-vault", "secrets", "kms"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []  # standard library only

[project.scripts]
lambdavault = "lambdavault.cli:main"

[project.urls]
Homepage = "https://github.com/cloudformer/lambdavault"
Repository = "https://github.com/cloudformer/lambdavault"
Deploy = "https://github.com/cloudformer/lambdavault#quick-start"
Compatibility = "https://github.com/cloudformer/lambdavault/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/lambdavault/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/lambdavault/issues"

[tool.setuptools]
packages = ["lambdavault"]
